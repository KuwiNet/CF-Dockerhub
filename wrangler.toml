name = "docker"
# main 指向 index.js：它在最外层接住 /search 与 /v1/search（首页搜索框/镜像搜索），
# 其余请求原样交给 worker.js（registry 代理逻辑不变）。wrangler 会自动打包两者。
main = "index.js"
compatibility_date = "2024-11-01"

# name 必须与 Cloudflare 面板里的 Worker 服务名逐字符一致：
# - 连了 Workers Builds 时不一致会直接构建失败；
# - 手动 wrangler deploy 时不一致会新建一个 Worker，而域名还指在旧 Worker 上。

# 自定义域名（在 Cloudflare 控制台加 Custom Domain，或用下面的 routes）
# [[routes]]
# pattern = "docker.arelay.cn/*"
# zone_name = "arelay.cn"

[observability]
enabled = true

[vars]
# 见 README 的环境变量表，按需取消注释
# URL = "nginx"
# URL302 = "https://example.com"
# UA = "netcraft"
# CACHE_TTL = "3600"
# DOCKER_AUTH 请用 `wrangler secret put DOCKER_AUTH` 注入，不要写在这个文件里
# BLOB_REDIRECT = "1"
# HOME_PAGE_URL = "https://kuwinet.github.io/d-proxy"
# PREFIX = ""
# AUTH_HOSTS = "auth.docker.io"
# ROUTES = '{"myreg":"registry.example.com"}'
# PUBLIC_HOST：前面接了 EdgeOne 等 CDN 时填对外域名，realm 才会指回对外域名
PUBLIC_HOST = "docker.arelay.cn"
