name = "cf-dockerhub"
main = "worker.js"
compatibility_date = "2024-11-01"

# 自定义域名（在 Cloudflare 控制台加 Custom Domain，或用下面的 routes）
# 注意：name 必须与线上已有的 Worker 服务名一致，否则会新建 Worker 而域名仍指向旧的
# [[routes]]
# pattern = "docker.arelay.cn/*"
# zone_name = "arelay.cn"

[observability]
enabled = true

[vars]
# 见 README 的环境变量表，按需取消注释
# URL = "nginx"
# URL302 = "https://example.com"
# UA = "netcraft"
# CACHE_TTL = "3600"
# DOCKER_AUTH 请用 `wrangler secret put DOCKER_AUTH` 注入，不要写在这个文件里
# BLOB_REDIRECT = "1"
# HOME_PAGE_URL = "https://kuwinet.github.io/d-proxy"
# PREFIX = ""
# AUTH_HOSTS = "auth.docker.io"
# ROUTES = '{"myreg":"registry.example.com"}'
